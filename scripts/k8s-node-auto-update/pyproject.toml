[project]
name = "k8s-node-auto-update"
version = "1.0.0"
description = "Weekly package update and reboot-marker utility for Kubernetes nodes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
k8s-node-auto-update = "k8s_node_auto_update.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_node_auto_update"]

[tool.pytest.ini_options]
testpaths = ["tests"]
